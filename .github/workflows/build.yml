name: build

on:
  workflow_dispatch:
    inputs:
      sbcl_version:
        description: SBCL version from versions.json to build and publish (empty = all)
        required: false
        default: ""
  schedule:
    # Monthly rebuild to pick up Debian security fixes.
    - cron: "17 4 3 * *"
  push:
    branches: [trunk]
    paths:
      - Dockerfile
      - .dockerignore
      - versions.json
      - keys/**
      - build/**
      - tests/**
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: read

# Publishing runs are serialized so two of them can't race on the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || 'publish' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      publish: ${{ steps.plan.outputs.publish }}
      date: ${{ steps.plan.outputs.date }}
      repo: ${{ steps.plan.outputs.repo }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        env:
          INPUT_VERSION: ${{ inputs.sbcl_version }}
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ -n "${INPUT_VERSION:-}" ]; then
            if ! jq -e --arg v "$INPUT_VERSION" '.sbcl | has($v)' versions.json >/dev/null; then
              echo "::error::SBCL $INPUT_VERSION is not in versions.json"
              exit 1
            fi
            versions=$(jq -nc --arg v "$INPUT_VERSION" '[$v]')
          else
            versions=$(jq -c '.sbcl | keys' versions.json)
          fi
          case $EVENT in
            schedule|workflow_dispatch) publish=true ;;
            *) publish=false ;;
          esac
          repo=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/kulhar-builder
          {
            echo "versions=$versions"
            echo "publish=$publish"
            echo "date=$(date -u +%Y%m%d)"
            echo "repo=$repo"
            echo "image=ghcr.io/$repo"
          } >>"$GITHUB_OUTPUT"
          echo "versions=$versions publish=$publish"

      # Checked again in the merge job right before tagging; this check only
      # avoids building and pushing digests for a run that would fail anyway.
      - name: Fail early if a dated tag already exists
        if: steps.plan.outputs.publish == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ steps.plan.outputs.versions }}
          DATE: ${{ steps.plan.outputs.date }}
          REPO: ${{ steps.plan.outputs.repo }}
        run: |
          set -eu
          for v in $(echo "$VERSIONS" | jq -r '.[]'); do
            tag="sbcl-$v-bookworm-$DATE"
            state=$(sh scripts/ghcr-tag-exists.sh "$REPO" "$tag") || true
            case $state in
              exists)
                echo "::error::ghcr.io/$REPO:$tag already exists. Dated tags are never overwritten."
                exit 1 ;;
              absent) echo "ghcr.io/$REPO:$tag is free" ;;
              *) echo "::warning::Could not check ghcr.io/$REPO:$tag ($state). The merge job checks again." ;;
            esac
          done

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        sbcl: ${{ fromJSON(needs.prepare.outputs.versions) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      CACHE_SCOPE: sbcl-${{ matrix.sbcl }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH from the commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kulhar-builder:smoke
          provenance: false
          sbom: false
          build-args: |
            SBCL_VERSION=${{ matrix.sbcl }}
            APT_REFRESH=${{ needs.prepare.outputs.date }}
            IMAGE_VERSION=sbcl-${{ matrix.sbcl }}-bookworm-${{ needs.prepare.outputs.date }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Smoke test
        run: sh tests/smoke.sh kulhar-builder:smoke "${{ matrix.sbcl }}"

      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the tested build, so every layer comes from the cache.
      - name: Push by digest
        id: push
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SBCL_VERSION=${{ matrix.sbcl }}
            APT_REFRESH=${{ needs.prepare.outputs.date }}
            IMAGE_VERSION=sbcl-${{ matrix.sbcl }}-bookworm-${{ needs.prepare.outputs.date }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Record digest
        if: needs.prepare.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
          echo "$IMAGE@$DIGEST ($CACHE_SCOPE)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.sbcl }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      matrix:
        sbcl: ${{ fromJSON(needs.prepare.outputs.versions) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      REPO: ${{ needs.prepare.outputs.repo }}
      DATED_TAG: sbcl-${{ matrix.sbcl }}-bookworm-${{ needs.prepare.outputs.date }}
      MOVING_TAG: sbcl-${{ matrix.sbcl }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.sbcl }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite the dated tag
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(sh scripts/ghcr-tag-exists.sh "$REPO" "$DATED_TAG") || true
          if [ "$state" != absent ]; then
            echo "::error::Not tagging $IMAGE:$DATED_TAG: $state. Dated tags are never overwritten."
            exit 1
          fi

      - name: Create the multi-architecture index
        id: index
        working-directory: digests
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          SBCL: ${{ matrix.sbcl }}
        run: |
          set -eu
          set --
          for d in *; do set -- "$@" "$IMAGE@sha256:$d"; done
          [ $# -eq 2 ] || { echo "::error::expected 2 digests, got: $*"; exit 1; }
          docker buildx imagetools create \
            --tag "$IMAGE:$DATED_TAG" \
            --tag "$IMAGE:$MOVING_TAG" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$DATED_TAG" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.description=kulhar builder image: SBCL $SBCL on Debian 12 (bookworm)" \
            "$@"
          digest=$(docker buildx imagetools inspect "$IMAGE:$DATED_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -eu
          {
            echo "### $IMAGE:$DATED_TAG"
            echo
            echo "Index: \`$IMAGE@$DIGEST\` (also tagged \`$MOVING_TAG\`)"
            echo
            echo "| Architecture | Manifest digest | Compressed size |"
            echo "| --- | --- | --- |"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
              | jq -r '.manifests[] | "\(.platform.architecture) \(.digest)"' \
              | while read -r arch d; do
                  size=$(docker buildx imagetools inspect "$IMAGE@$d" --raw | jq '[.layers[].size] | add')
                  echo "| $arch | \`$d\` | $(numfmt --to=iec-i --suffix=B "$size") ($size bytes) |"
                done
          } | tee -a "$GITHUB_STEP_SUMMARY"
